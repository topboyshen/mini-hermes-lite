name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-frozen.txt
          pip install pytest ruff
          pip check
      - name: Byte-compile
        env:
          PYTHONPATH: app
        run: python -m compileall -q app/mini_hermes
      - name: Ruff (gateway)
        # Focused on gateway (recently split); avoids boiling the ocean on legacy code.
        run: ruff check app/mini_hermes/gateway
      - name: Run unit tests
        env:
          PYTHONPATH: app
        run: pytest -q --ignore-glob='smoke_*'
